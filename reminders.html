<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التذكيرات | ASGate</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="reminders.css">
</head>
<body style="margin: 0; padding: 0;">

<div class="dashboard-container">    
<!-- شريط التنقل العلوي -->
<nav class="navbar">
    <a href="index.html">الرئيسية</a>
    <a href="visits.html">الزيارات</a>
    <a href="opportunities.html">الفرص البيعية</a>
    <a href="customers.html">العملاء</a>
    <a href="sales.html">المبيعات</a>
    <a href="reminders.html" class="active">التذكيرات</a>
</nav>

    <div class="reminders-container">
        <div class="reminders-grid" id="remindersGrid">
            <!-- يتم توليد الـ 12 مذكرة برمجياً -->
        </div>
    </div>
</div>

<!-- التقويم المتحرك المخصص -->
<div class="calendar-overlay" id="calendarOverlay">
    <div class="custom-datepicker">
        <div class="datepicker-header">
            <div class="nav-section">
                <button class="arrow-btn" id="prevMonthBtn">&lsaquo;</button>
                <span id="calMonthLabel">Jul</span>
                <button class="arrow-btn" id="nextMonthBtn">&rsaquo;</button>
            </div>
            <div class="nav-section">
                <button class="arrow-btn" id="prevYearBtn">&lsaquo;</button>
                <span id="calYearLabel">2026</span>
                <button class="arrow-btn" id="nextYearBtn">&rsaquo;</button>
            </div>
        </div>

        <div class="weekdays-grid">
            <span>Su</span>
            <span>Mo</span>
            <span>Tu</span>
            <span>We</span>
            <span>Th</span>
            <span class="weekend-day">Fr</span>
            <span class="weekend-day">Sa</span>
        </div>

        <div class="days-container">
            <div class="days-grid" id="calDaysGrid">
                <!-- أرقام الأيام تتولد برمجياً -->
            </div>
        </div>

        <div class="datepicker-footer">
            <button class="btn-cancel" id="calCancelBtn">Cancel</button>
            <div class="action-buttons">
                <button class="btn-clear" id="calClearBtn">Clear</button>
                <button class="btn-next" id="calNextBtn">Next</button>
            </div>
        </div>
    </div>
</div>

    <script type="module" src="reminders.js"></script>
</body>
</html>
